name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (lint/test deps only — heavy ML deps skipped in CI)
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest numpy
      - name: Lint
        run: ruff check crate eval
      - name: Test (unit tests that don't need model weights)
        run: pytest -q -m "not heavy"

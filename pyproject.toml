[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crate"
version = "0.1.0"
description = "Sound-native search & discovery for music producers — hum, drop a track, or describe it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jahnavi Yelamanchi" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.11",
    "librosa>=0.10",
    "soundfile>=0.12",
    "faiss-cpu>=1.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = ["datasets>=2.19", "huggingface_hub>=0.23", "accelerate>=0.30"]
quant = ["onnx>=1.16", "onnxruntime>=1.18", "optimum>=1.20"]
stems = ["demucs>=4.0"]
dev = ["ruff>=0.4", "pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["crate*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["eval", "tests"]
